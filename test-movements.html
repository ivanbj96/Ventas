<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test - Movimientos y Botón Ojo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container mt-4">
    <h1>Test - Movimientos y Botón Ojo</h1>
    
    <div class="row">
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <h5>Test de Ventas</h5>
          </div>
          <div class="card-body">
            <button class="btn btn-primary" onclick="testNormalSale()">
              <i class="bi bi-cart-plus"></i> Crear Venta Normal
            </button>
            <button class="btn btn-warning" onclick="testChickenSale()">
              <i class="bi bi-egg-fried"></i> Crear Venta de Pollos
            </button>
          </div>
        </div>
      </div>
      
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <h5>Test de Movimientos</h5>
          </div>
          <div class="card-body">
            <button class="btn btn-info" onclick="testMovements()">
              <i class="bi bi-graph-up"></i> Ver Movimientos
            </button>
            <button class="btn btn-success" onclick="testRevenueToggle()">
              <i class="bi bi-eye"></i> Test Botón Ojo
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <div class="row mt-4">
      <div class="col-12">
        <div class="card">
          <div class="card-header">
            <h5>Resultados</h5>
          </div>
          <div class="card-body">
            <div id="results"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="utils.js"></script>
  <script src="app.js"></script>
  
  <script>
    // Función para mostrar resultados
    function showResult(message, type = 'info') {
      const results = document.getElementById('results');
      const timestamp = new Date().toLocaleTimeString();
      const resultHtml = `
        <div class="alert alert-${type}">
          <strong>[${timestamp}]</strong> ${message}
        </div>
      `;
      results.innerHTML = resultHtml + results.innerHTML;
    }

    // Test de venta normal
    async function testNormalSale() {
      try {
        // Simular datos necesarios
        if (!window.products || window.products.length === 0) {
          window.products = [{
            id: 'test-product-1',
            name: 'Producto Test',
            price: 25.00,
            cost: 15.00,
            stock: 10
          }];
        }
        
        if (!window.clients || window.clients.length === 0) {
          window.clients = [{
            id: 'test-client-1',
            name: 'Cliente Test'
          }];
        }
        
        if (!window.sales) window.sales = [];
        if (!window.movements) window.movements = [];
        
        // Simular carrito
        window.cart = [{
          id: 'test-product-1',
          name: 'Producto Test',
          price: 25.00,
          cost: 15.00,
          qty: 2
        }];
        
        window.currentClientId = 'test-client-1';
        
        // Crear venta
        const sale = {
          id: 'test-sale-' + Date.now(),
          clientId: 'test-client-1',
          clientName: 'Cliente Test',
          items: window.cart,
          total: 50.00,
          originalTotal: 50.00,
          discount: 0,
          cost: 30.00,
          profit: 20.00,
          paymentType: 'cash',
          date: new Date().toISOString(),
          time: new Date().toLocaleTimeString()
        };
        
        window.sales.push(sale);
        
        // Agregar movimiento
        const movement = {
          type: 'sale',
          icon: 'bi-cart-check',
          title: `Venta #${sale.id}`,
          subtitle: `Cliente Test - ${new Date().toLocaleDateString()}`,
          amount: 50.00,
          amountClass: 'positive',
          date: new Date(),
          data: sale,
          category: 'ventas'
        };
        
        window.movements.push(movement);
        
        // Guardar datos
        await saveToStorage('sales', window.sales);
        await saveToStorage('movements', window.movements);
        
        showResult('Venta normal creada exitosamente', 'success');
        console.log('Venta creada:', sale);
        console.log('Movimiento creado:', movement);
        
      } catch (error) {
        showResult('Error creando venta normal: ' + error.message, 'danger');
        console.error('Error:', error);
      }
    }

    // Test de venta de pollos
    async function testChickenSale() {
      try {
        if (!window.clients || window.clients.length === 0) {
          window.clients = [{
            id: 'test-client-1',
            name: 'Cliente Test'
          }];
        }
        
        if (!window.chickenSales) window.chickenSales = [];
        if (!window.movements) window.movements = [];
        
        // Crear venta de pollos
        const sale = {
          id: 'test-chicken-' + Date.now(),
          clientId: 'test-client-1',
          clientName: 'Cliente Test',
          quantity: 2,
          weight: 5.5,
          pricePerPound: 2.50,
          total: 13.75,
          date: new Date().toISOString(),
          time: new Date().toLocaleTimeString(),
          paymentType: 'cash',
          abono: 0,
          profit: 2.75,
          createdAt: new Date().toISOString()
        };
        
        window.chickenSales.push(sale);
        
        // Agregar movimiento
        const movement = {
          type: 'chicken_sale',
          icon: 'bi-egg-fried',
          title: `Venta Pollos #${sale.id}`,
          subtitle: `Cliente Test - ${new Date().toLocaleDateString()}`,
          amount: 13.75,
          amountClass: 'positive',
          date: new Date(),
          data: sale,
          category: 'pollos'
        };
        
        window.movements.push(movement);
        
        // Guardar datos
        await saveToStorage('chickenSales', window.chickenSales);
        await saveToStorage('movements', window.movements);
        
        showResult('Venta de pollos creada exitosamente', 'success');
        console.log('Venta de pollos creada:', sale);
        console.log('Movimiento creado:', movement);
        
      } catch (error) {
        showResult('Error creando venta de pollos: ' + error.message, 'danger');
        console.error('Error:', error);
      }
    }

    // Test de movimientos
    function testMovements() {
      try {
        const { startDate, endDate } = getDateRangeFromFilter('today');
        const movements = getAllMovementsInRange(startDate, endDate);
        
        showResult(`Movimientos encontrados: ${movements.length}`, 'info');
        console.log('Movimientos:', movements);
        
        // Actualizar estadísticas
        updateMovementStats(movements);
        
      } catch (error) {
        showResult('Error obteniendo movimientos: ' + error.message, 'danger');
        console.error('Error:', error);
      }
    }

    // Test del botón ojo
    function testRevenueToggle() {
      try {
        // Simular elementos del DOM
        const revenueElement = document.createElement('div');
        revenueElement.id = 'totalRevenue';
        revenueElement.textContent = '$100.00';
        revenueElement.setAttribute('data-actual-value', '$100.00');
        revenueElement.classList.add('hidden-revenue');
        
        const eyeIcon = document.createElement('i');
        eyeIcon.id = 'revenueEyeIcon';
        eyeIcon.classList.add('bi', 'bi-eye');
        
        // Agregar al DOM temporalmente
        document.body.appendChild(revenueElement);
        document.body.appendChild(eyeIcon);
        
        // Probar toggle
        toggleRevenueVisibility();
        
        const isHidden = revenueElement.classList.contains('hidden-revenue');
        showResult(`Botón ojo funcionando. Estado: ${isHidden ? 'Oculto' : 'Visible'}`, 'success');
        
        // Limpiar
        document.body.removeChild(revenueElement);
        document.body.removeChild(eyeIcon);
        
      } catch (error) {
        showResult('Error probando botón ojo: ' + error.message, 'danger');
        console.error('Error:', error);
      }
    }

    // Inicializar al cargar la página
    document.addEventListener('DOMContentLoaded', async () => {
      showResult('Página de prueba cargada. Puedes probar las funciones.', 'info');
      
      // Cargar datos existentes
      try {
        const data = await loadAllCriticalData();
        window.products = data.products || [];
        window.clients = data.clients || [];
        window.sales = data.sales || [];
        window.chickenSales = data.chickenSales || [];
        window.movements = data.movements || [];
        
        showResult(`Datos cargados: ${window.sales.length} ventas, ${window.chickenSales.length} ventas de pollos, ${window.movements.length} movimientos`, 'info');
      } catch (error) {
        showResult('Error cargando datos: ' + error.message, 'warning');
      }
    });
  </script>
</body>
</html>
