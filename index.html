<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TillUp - Gestión de Ventas</title>

  <!-- 🧩 Bootstrap 5.3 (CDN actualizado) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  
<!-- jsPDF 2.5.1 -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<!-- jsPDF AutoTable 3.5.28 -->
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.28/dist/jspdf.plugin.autotable.min.js"></script>

  <!-- 🌓 Soporte para ícono y PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <meta name="theme-color" content="#0d6efd" />

  <!-- Estilo personalizado -->
  <link rel="stylesheet" href="style.css" />
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

  <!-- ✅ Barra superior fija -->
  <header class="bg-primary text-white text-center py-3 shadow-sm position-relative">
    <h1 class="h5 mb-0">TillUp - Gestión POS</h1>
    <button id="btnSidebar" class="btn btn-light position-absolute top-50 end-0 translate-middle-y me-2" style="z-index:1051;">
      <i class="bi bi-list fs-4"></i>
    </button>
  </header>

  <!-- Sidebar lateral -->
  <div id="sidebarMenu" class="position-fixed top-0 end-0 bg-white shadow-lg" style="width:270px;height:100vh;z-index:1052;transform:translateX(100%);transition:transform 0.3s;">
    <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
      <span class="fw-bold">Menú</span>
      <button id="btnCloseSidebar" class="btn btn-sm btn-outline-secondary"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="p-3">
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" id="themeSwitch">
        <label class="form-check-label" for="themeSwitch">Modo oscuro</label>
      </div>
      <!-- Aquí puedes agregar más opciones en el futuro -->
    </div>
  </div>
  <div id="sidebarOverlay" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1051;background:rgba(0,0,0,0.25);"></div>

<script>
  function showView(viewName) {
    document.querySelectorAll('.app-view').forEach(v => v.classList.add('d-none'));
    document.getElementById(`view-${viewName}`).classList.remove('d-none');
  }

  // Por defecto, mostrar vista de Inventario
  document.addEventListener('DOMContentLoaded', () => {
    showView('inventory');
  });
</script>

  <main class="container py-3" id="mainContent">

    <!-- Vista: Inventario -->
    <section id="view-inventory" class="app-view">
      <h2 class="mb-3 text-center">Inventario</h2>
      <div class="mb-4 text-end">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalProduct">
          <i class="bi bi-plus-circle"></i> Agregar producto
        </button>
        <button id="toggleInventoryView" class="btn btn-outline-secondary ms-2" type="button">
          <i class="bi bi-grid-3x3-gap-fill"></i> <span id="toggleInventoryViewText">Cuadrícula</span>
        </button>
      </div>
      <div id="inventoryList" class="row gy-3"></div>
    </section>

    <!-- Modal Producto -->
    <div class="modal fade" id="modalProduct" tabindex="-1" aria-labelledby="modalProductLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalProductLabel">Agregar producto</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <form id="formProduct">
              <div class="mb-2">
                <input type="text" id="productName" class="form-control" placeholder="Nombre del producto" required />
              </div>
              <div class="row g-2 mb-2">
                <div class="col">
                  <input type="number" id="productCost" step="0.01" class="form-control" placeholder="Costo" required />
                </div>
                <div class="col">
                  <input type="number" id="productPrice" step="0.01" class="form-control" placeholder="Precio de venta" required />
                </div>
              </div>
              <div class="mb-2">
                <input type="text" id="productCategory" class="form-control" placeholder="Categoría" />
              </div>
              <div class="mb-3">
                <input type="file" id="productImage" class="form-control" accept="image/*" />
              </div>
              <button type="submit" class="btn btn-primary w-100">Agregar producto</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Vista: Ventas -->
    <section id="view-sales" class="app-view d-none">

<div id="installBanner" class="text-center my-3 d-none">
  <button id="btnInstall" class="btn btn-success px-4 py-2 fw-bold">
    <i class="bi bi-download me-2"></i> Instalar TillUp
  </button>
</div>

  <h2 class="mb-3 text-center">Ventas</h2>

  <div class="mb-3">
    <label for="clientSelector" class="form-label">Seleccionar Cliente</label>
    <select id="clientSelector" class="form-select" required>
      <option disabled selected value="">Selecciona un cliente</option>
    </select>
  </div>

  <div id="productSalesList" class="row gy-3 mb-4">
    <!-- Cards de productos para venta -->
  </div>

  <h5 class="text-center">🛒 Carrito de compra</h5>
  <div id="cartList" class="mb-3"></div>

  <div class="d-grid gap-2">
    <button onclick="finalizeSale()" class="btn btn-success">Finalizar venta</button>
    <button onclick="clearCart()" class="btn btn-outline-danger">Vaciar carrito</button>
  </div>
</section>

<!-- Vista: Clientes -->
<section id="view-clients" class="app-view d-none">
  <h2 class="mb-3 text-center">Clientes</h2>
  <div class="mb-4 text-end">
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalClient">
      <i class="bi bi-person-plus"></i> Agregar cliente
    </button>
    <button id="toggleClientsView" class="btn btn-outline-secondary ms-2" type="button">
      <i class="bi bi-grid-3x3-gap-fill"></i> <span id="toggleClientsViewText">Cuadrícula</span>
    </button>
  </div>
  <ul id="clientList" class="list-group"></ul>
</section>

<!-- Modal Cliente -->
<div class="modal fade" id="modalClient" tabindex="-1" aria-labelledby="modalClientLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalClientLabel">Agregar cliente</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <form id="formClient">
          <div class="mb-3">
            <input type="text" id="clientName" class="form-control" placeholder="Nombre del cliente" required />
          </div>
          <div class="mb-3">
            <input type="tel" id="clientPhone" class="form-control" placeholder="Celular" pattern="[0-9]{7,15}" />
          </div>
          <div class="mb-3">
            <input type="text" id="clientAddress" class="form-control" placeholder="Dirección" />
          </div>
          <div class="mb-3">
            <input type="file" id="clientPhoto" class="form-control" accept="image/*" />
          </div>
          <div class="mb-3">
            <button type="button" class="btn btn-outline-success w-100" id="btnGetLocation">
              <i class="bi bi-geo-alt-fill"></i> Agregar ubicación actual
            </button>
            <input type="hidden" id="clientLocation" />
            <div id="locationStatus" class="small text-muted mt-1"></div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Agregar cliente</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Vista: Deudas -->
<section id="view-debt" class="app-view d-none">
  <h2 class="mb-3 text-center">Deudas</h2>

  <div class="d-flex justify-content-end mb-2">
    <button onclick="generatePDF('debt')" class="btn btn-outline-dark btn-sm">Exportar PDF</button>
  </div>

  <div id="debtList" class="row gy-3">
    <!-- Lista de deudas cargada por JS -->
  </div>
</section>

<!-- Vista: Balance -->
<section id="view-balance" class="app-view d-none">
  <h2 class="mb-3 text-center">Balance General</h2>

  <div id="balanceGrid" class="row g-3 justify-content-center">
    <!-- Tarjetas de resumen generadas por JS -->
  </div>

  <div class="text-end mt-4">
    <button onclick="generatePDF('balance')" class="btn btn-outline-dark btn-sm">Exportar Balance PDF</button>
  </div>
</section>

  </main>

  <!-- 📱 Barra de navegación inferior estilo app -->
  <nav class="navbar fixed-bottom bg-white border-top d-flex justify-content-around py-2">
    <button class="btn btn-link flex-fill text-center" onclick="showView('inventory')">
      <i class="bi bi-box-seam fs-5"></i><br><small>Inventario</small>
    </button>
    <button class="btn btn-link flex-fill text-center" onclick="showView('sales')">
      <i class="bi bi-cart-check fs-5"></i><br><small>Ventas</small>
    </button>
    <button class="btn btn-link flex-fill text-center" onclick="showView('clients')">
      <i class="bi bi-people fs-5"></i><br><small>Clientes</small>
    </button>
    <button class="btn btn-link flex-fill text-center" onclick="showView('debt')">
      <i class="bi bi-cash-stack fs-5"></i><br><small>Deudas</small>
    </button>
    <button class="btn btn-link flex-fill text-center" onclick="showView('balance')">
      <i class="bi bi-graph-up fs-5"></i><br><small>Balance</small>
    </button>
  </nav>

  <!-- JS Bootstrap y lógica principal -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="utils.js"></script>
  <script src="app.js"></script>
  <script src="ubicacion.js"></script>
  <script src="./pdf-generator.js"></script>
</body>
</html>
