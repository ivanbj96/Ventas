<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f0f4f8" />
  <title>Gestión de Clientes y Ventas</title>
  <!-- <link rel="manifest" href="manifest.json" /> -->
  <style>
    body {
      font-family: sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 1rem;
      color: #333;
    }
    header {
      background-color: #e0e7ef;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-bottom: 1rem;
    }
    section {
      margin-bottom: 2rem;
    }
    input, select, button, textarea {
      padding: 0.5rem;
      margin: 0.3rem 0;
      border: 1px solid #ccc;
      border-radius: 0.3rem;
      width: 100%;
    }
    button {
      background-color: #4caf50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    .mapa {
      height: 300px;
      margin-top: 1rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Gestión de Clientes y Ventas</h1>
  </header>  <section id="cliente">
    <h2>Clientes</h2>
    <form id="clienteForm">
      <input type="text" placeholder="Nombre del cliente" required />
      <input type="text" placeholder="Dirección" />
      <input type="text" placeholder="Teléfono" />
      <button type="submit">Guardar Cliente</button>
    </form>
  </section>  <section id="ventas">
    <h2>Ventas</h2>
    <form id="ventaForm">
      <select required>
        <option disabled selected>Seleccione un cliente</option>
        <!-- Aquí se llenan los clientes dinámicamente -->
      </select>
      <input type="text" placeholder="Producto o servicio" required />
      <input type="number" placeholder="Monto" required />
      <select>
        <option value="contado">Contado</option>
        <option value="credito">Crédito</option>
      </select>
      <button type="submit">Registrar Venta</button>
    </form>
  </section>  <section id="mapa">
    <h2>Ubicación de Clientes</h2>
    <div id="map" class="mapa"></div>
  </section>  <section id="reporte">
    <h2>Reportes</h2>
    <button onclick="generarReporte()">Generar Reporte</button>
    <pre id="reporteDatos"></pre>
  </section>  <script>
    let db;
    const request = indexedDB.open("AppVentas", 1);

    request.onerror = () => alert("Error al abrir la base de datos");

    request.onupgradeneeded = (e) => {
      db = e.target.result;
      db.createObjectStore("clientes", { keyPath: "id", autoIncrement: true });
      db.createObjectStore("ventas", { keyPath: "id", autoIncrement: true });
    };

    request.onsuccess = (e) => {
      db = e.target.result;
      console.log("DB cargada correctamente");
    };

    document.getElementById("clienteForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const cliente = {
        nombre: this[0].value,
        direccion: this[1].value,
        telefono: this[2].value
      };
      const tx = db.transaction("clientes", "readwrite");
      tx.objectStore("clientes").add(cliente);
      alert("Cliente guardado");
      this.reset();
    });

    document.getElementById("ventaForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const venta = {
        cliente: this[0].value,
        producto: this[1].value,
        monto: parseFloat(this[2].value),
        tipo: this[3].value,
        fecha: new Date().toISOString()
      };
      const tx = db.transaction("ventas", "readwrite");
      tx.objectStore("ventas").add(venta);
      alert("Venta registrada");
      this.reset();
    });

    function generarReporte() {
      const tx = db.transaction("ventas", "readonly");
      const store = tx.objectStore("ventas");
      const req = store.getAll();
      req.onsuccess = () => {
        document.getElementById("reporteDatos").textContent = JSON.stringify(req.result, null, 2);
      };
    }
  </script>  <script async defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap"></script>  <script>
    function initMap() {
      const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 4,
        center: { lat: -34.397, lng: 150.644 },
      });
    }
  </script></body>
               </html>
