<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TillUp POS</title>

  <meta name="theme-color" content="#3498db" />
  <!-- <link rel="manifest" href="manifest.json" /> -->
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />

  <!-- jsPDF y autoTable para reportes -->
  <script  src=" https://cdnjs.cloudflare.com/ajax/libs/jspdf/3.0.1/jspdf.umd.min.js "> </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/5.0.2/jspdf.plugin.autotable.min.js" integrity="sha512-JizZOUNesiGhMcp9fsA/9W31FOat6QysBM8hSj6ir8iIANIUJ2mhko7Lo1+j0ErftmJ8SebMZLm9iielKjeIEQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
  <header>
    <h1>TillUp POS</h1>
    <nav>
      <button onclick="showSection('inventory')">Inventario</button>
      <button onclick="showSection('sales')">Ventas</button>
      <button onclick="showSection('balance')">Balance</button>
      <button onclick="showSection('clients')">Clientes</button>
      <button onclick="showSection('debts')">Deudas</button>
    </nav>
  </header>

  <main>
    <!-- INVENTARIO -->
    <section id="inventory" class="section">
      <h2>Inventario</h2>
      <form id="productForm">
        <input type="text" id="productName" placeholder="Nombre del producto" required />
        <input type="number" id="productCost" placeholder="Costo" required />
        <input type="number" id="productPrice" placeholder="Precio de venta" required />
        <input type="text" id="productCategory" placeholder="Categoría" required />
        <input type="file" id="productImage" accept="image/*" />
        <button type="submit">Agregar producto</button>
      </form>
      <div id="productList" class="card-grid"></div>
    </section>

    <!-- VENTAS -->
    <section id="sales" class="section hidden">
      <h2>Ventas</h2>
      <label for="clientSelector">Cliente:</label>
      <select id="clientSelector"></select>
      <div id="productSalesList" class="card-grid"></div>
      <h3>Carrito</h3>
      <div id="cart" class="card-grid"></div>
      <button onclick="finalizeSale()">Finalizar venta</button>
    </section>

    <!-- BALANCE -->
    <section id="balance" class="section hidden">
      <h2>Balance general</h2>
      <p id="totalEarnings">Ganancias: $0</p>
      <p id="totalLosses">Pérdidas: $0</p>
      <p id="pendingDebts">Deudas pendientes: $0</p>
      <button onclick="generatePDF('balance')">Exportar Balance (PDF)</button>
    </section>

    <!-- CLIENTES -->
    <section id="clients" class="section hidden">
      <h2>Clientes</h2>
      <form id="clientForm">
        <input type="text" id="clientName" placeholder="Nombre del cliente" required />
        <button type="submit">Agregar Cliente</button>
      </form>
      <ul id="clientList"></ul>
    </section>

    <!-- DEUDAS -->
    <section id="debts" class="section hidden">
      <h2>Deudas</h2>
      <div id="debtList" class="card-grid"></div>
      <button onclick="generatePDF('debts')">Exportar Deudas (PDF)</button>
    </section>
  </main>

  <!-- Scripts -->
  <script src="utils.js"></script>
  <script src="pdf-generator.js"></script>
  <script src="app.js"></script>

    }
  </script> --> 
</body>
</html>
