<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TillUp POS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">
      <img src="TillUp.png" alt="Logo TillUp" />
    </div>
    <h1>Mi App POS</h1>
  </header>  <main>
    <!-- Vistas -->
    <section id="vista-ventas" class="vista active">
      <h2>Ventas</h2>
      <button onclick="abrirModal('modal-venta')">Registrar Venta</button>
      <table id="tabla-ventas">
        <thead>
          <tr><th>Producto</th><th>Cantidad</th><th>Total</th><th>Tipo</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section><section id="vista-inv" class="vista">
  <h2>Inventario</h2>
  <button onclick="abrirModal('modal-inv')">Agregar Producto</button>
  <table id="tabla-inv">
    <thead>
      <tr><th>Nombre</th><th>Stock</th><th>Precio</th><th>Acciones</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<section id="vista-clientes" class="vista">
  <h2>Clientes</h2>
  <button onclick="abrirModal('modal-cliente')">Agregar Cliente</button>
  <table id="tabla-clientes">
    <thead>
      <tr><th>Nombre</th><th>Acciones</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<section id="vista-deudas" class="vista">
  <h2>Deudas</h2>
  <table id="tabla-deudas">
    <thead>
      <tr><th>Cliente</th><th>Total</th><th>Acciones</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

  </main>  <footer>
    <button onclick="cambiarVista('ventas')">Ventas</button>
    <button onclick="cambiarVista('inv')">Inventario</button>
    <button onclick="cambiarVista('clientes')">Clientes</button>
    <button onclick="cambiarVista('deudas')">Deudas</button>
  </footer>  <!-- Modales -->  <div class="modal" id="modal-cliente">
    <div class="modal-content">
      <h3>Agregar Cliente</h3>
      <label>Nombre:</label>
      <input id="cliente-nombre" type="text" placeholder="Nombre del cliente" />
      <button onclick="registrarCliente()">Guardar</button>
      <button onclick="cerrarModal('modal-cliente')">Cancelar</button>
    </div>
  </div>  <div class="modal" id="modal-inv">
    <div class="modal-content">
      <h3>Agregar Producto</h3>
      <label>Nombre:</label>
      <input id="inv-nombre" type="text" />
      <label>Stock:</label>
      <input id="inv-stock" type="number" />
      <label>Precio:</label>
      <input id="inv-precio" type="number" />
      <button onclick="agregarProducto()">Guardar</button>
      <button onclick="cerrarModal('modal-inv')">Cancelar</button>
    </div>
  </div>  <div class="modal" id="modal-venta">
    <div class="modal-content">
      <h3>Registrar Venta</h3>
      <label>Fecha de factura:</label>
      <input type="date" id="venta-fecha" /><div id="carrito">
    <div class="linea-carrito">
      <select class="producto-linea"></select>
      <input type="number" class="cantidad-linea" placeholder="Cantidad" />
      <button onclick="eliminarLinea(this)">X</button>
    </div>
  </div>
  <button onclick="agregarLinea()">+ Producto</button>

  <label>Tipo de pago:</label>
  <select id="venta-tipo">
    <option value="contado">Contado</option>
    <option value="credito">Crédito</option>
  </select>

  <label>Cliente:</label>
  <select id="venta-cliente"></select>

  <button onclick="registrarVenta()">Guardar</button>
  <button onclick="cerrarModal('modal-venta')">Cancelar</button>
</div>

  </div>  <script src="app.js"></script></body>
</html>
