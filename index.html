<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App POS - PWA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo"></div>
        <h1>Mi App POS</h1>
    </header>

    <main>
        <section id="vista-ventas" class="vista active">
            <h2>Ventas del Día</h2>
            <button onclick="abrirModal('modal-venta')">+ Registrar Venta</button>
            <table id="tabla-ventas" class="tabla">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Total</th>
                        <th>Tipo</th>
                        <th>Cliente</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla-ventas"></tbody>
            </table>
        </section>

        <section id="vista-balance" class="vista">
            <h2>Balance</h2>
            <select id="filtro-tipo">
                <option value="">--Seleccionar--</option>
                <option value="hoy">Hoy</option>
                <option value="mes">Este Mes</option>
                <option value="anio">Este Año</option>
                <option value="rango">Rango</option>
            </select>
            <input type="date" id="filtro-inicio">
            <input type="date" id="filtro-fin">
            <button onclick="filtrarBalance()">Filtrar</button>
            <table id="tabla-balance" class="tabla">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla-balance"></tbody>
            </table>
        </section>

        <section id="vista-inventario" class="vista">
            <h2>Inventario</h2>
            <button onclick="abrirModal('modal-inv')">+ Agregar Producto</button>
            <table id="tabla-inv" class="tabla">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Stock</th>
                        <th>Precio</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla-inv"></tbody>
            </table>
        </section>

        <section id="vista-clientes" class="vista">
            <h2>Clientes</h2>
            <button onclick="abrirModal('modal-cliente')">+ Agregar Cliente</button>
            <table id="tabla-clientes" class="tabla">
                <thead>
                    <tr>
                        <th>Nombre</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla-clientes"></tbody>
            </table>
        </section>

        <section id="vista-deudas" class="vista">
            <h2>Deudas</h2>
            <table id="tabla-deudas" class="tabla">
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla-deudas"></tbody>
            </table>
        </section>
    </main>

    <footer>
        <button data-vista="ventas">📦 Ventas</button>
        <button data-vista="balance">📊 Balance</button>
        <button data-vista="inventario">📦 Inventario</button>
        <button data-vista="clientes">👤 Clientes</button>
        <button data-vista="deudas">💸 Deudas</button>
    </footer>

    <div class="modal" id="modal-venta">
        <div class="modal-content">
            <h3>Registrar Venta</h3>
            <select id="venta-producto"></select>
            <input type="number" id="venta-cantidad" placeholder="Cantidad">
            <select id="venta-tipo">
                <option value="contado">Contado</option>
                <option value="credito">Crédito</option>
            </select>
            <select id="venta-cliente"></select>
            <button onclick="registrarVenta()">Guardar</button>
            <button onclick="cerrarModal('modal-venta')">Cancelar</button>
        </div>
    </div>

    <div class="modal" id="modal-inv">
        <div class="modal-content">
            <h3>Agregar Producto</h3>
            <input id="inv-nombre" placeholder="Nombre del Producto"/>
            <input type="number" id="inv-stock" placeholder="Stock"/>
            <input type="number" id="inv-precio" placeholder="Precio"/>
            <button onclick="agregarProducto()">Guardar</button>
            <button onclick="cerrarModal('modal-inv')">Cancelar</button>
        </div>
    </div>

    <div class="modal" id="modal-cliente">
        <div class="modal-content">
            <h3>Registrar Cliente</h3>
            <input id="cliente-nombre" placeholder="Nombre del Cliente"/>
            <button onclick="registrarCliente()">Guardar</button>
            <button onclick="cerrarModal('modal-cliente')">Cancelar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
