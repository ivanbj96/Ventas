<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>TillUp POS</title>
</head>
<body>
  <header>
    <img src="TillUp.png" class="logo" alt="TillUp Logo">
    <h1>TillUp</h1>
  </header>

  <main>
    <section id="vista-ventas" class="vista active">
      <h2>Ventas</h2>
      <button onclick="abrirModal('modal-venta')">Nueva Venta</button>
      <table id="tabla-ventas">
        <thead>
          <tr><th>Producto</th><th>Cantidad</th><th>Peso</th><th>Precio/Lb</th><th>Total</th><th>Cliente</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="vista-clientes" class="vista">
      <h2>Clientes</h2>
      <button onclick="abrirModal('modal-cliente')">Nuevo Cliente</button>
      <table id="tabla-clientes">
        <thead><tr><th>Nombre</th><th>Acciones</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="vista-balance" class="vista">
      <h2>Balance</h2>
      <button onclick="descargarPDF()">Descargar Reporte</button>
    </section>

    <section id="vista-deudas" class="vista">
      <h2>Deudas</h2>
      <p>(Funcionalidad por implementar)</p>
    </section>

    <section id="vista-inventario" class="vista">
      <h2>Inventario</h2>
      <p>(Funcionalidad por implementar)</p>
    </section>
  </main>

  <footer>
    <button onclick="cambiarVista('ventas')">
      📦<span>Ventas</span>
    </button>
    <button onclick="cambiarVista('clientes')">
      👥<span>Clientes</span>
    </button>
    <button onclick="cambiarVista('balance')">
      📊<span>Balance</span>
    </button>
    <button onclick="cambiarVista('deudas')">
      💳<span>Deudas</span>
    </button>
    <button onclick="cambiarVista('inventario')">
      🧾<span>Inventario</span>
    </button>
  </footer>

  <!-- Modales -->
  <div class="modal" id="modal-venta">
    <div class="modal-content">
      <label>Producto<input></label>
      <label>Cantidad<input type="number" value="1"></label>
      <label>Peso total (lbs)<input type="number" step="0.01"></label>
      <label>Precio por libra<input type="number" step="0.01"></label>
      <label>Cliente<select><option value="">Seleccionar</option></select></label>
      <button>Guardar</button>
    </div>
  </div>

  <div class="modal" id="modal-cliente">
    <div class="modal-content">
      <label>Nombre del cliente<input></label>
      <button>Guardar</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
