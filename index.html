<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS - Ventas e Inventario</title>
  <link rel="stylesheet" href="style.css">
  <!-- <link rel="manifest" href="manifest.json"> -->
  <meta name="theme-color" content="#4CAF50">
</head>
<body>
  <header>
    <h1>POS Treinta+</h1>
    <p>Ventas + Inventario</p>
  </header>

  <main>
    <section class="card">
      <h2>Agregar Producto al Inventario</h2>
      <input id="inv-nombre" type="text" placeholder="Nombre del producto">
      <input id="inv-stock" type="number" placeholder="Cantidad inicial">
      <input id="inv-precio" type="number" placeholder="Precio unitario">
      <button onclick="agregarProducto()">Agregar al Inventario</button>
    </section>

    <section class="card">
      <h2>Registrar Venta</h2>
      <select id="venta-producto"></select>
      <input id="venta-cantidad" type="number" placeholder="Cantidad">
      <button onclick="registrarVenta()">Vender</button>
    </section>

    <section class="card">
      <h2>Inventario</h2>
      <div id="inventario-lista"></div>
    </section>

    <section class="card">
      <h2>Historial de Ventas</h2>
      <div id="ventas-lista"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
