<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TillUp POS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="logo" style="background-image: url('TillUp.png'); background-size: cover;"></div>
    <h1>TillUp POS</h1>
  </header>

  <main>
    <!-- VENTAS -->
    <section id="vista-ventas" class="vista active">
      <h2>Ventas</h2>
      <button onclick="abrirModal('modal-venta')">Registrar Venta</button>
      <div class="tabla-responsive">
        <table id="tabla-ventas">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Cantidad</th>
              <th>Total</th>
              <th>Tipo</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- INVENTARIO -->
    <section id="vista-inventario" class="vista">
      <h2>Inventario</h2>
      <button onclick="abrirModal('modal-inv')">Agregar Producto</button>
      <div class="tabla-responsive">
        <table id="tabla-inv">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Stock</th>
              <th>Precio</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- CLIENTES -->
    <section id="vista-clientes" class="vista">
      <h2>Clientes</h2>
      <button onclick="abrirModal('modal-cliente')">Registrar Cliente</button>
      <div class="tabla-responsive">
        <table id="tabla-clientes">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Última Compra</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- DEUDAS -->
    <section id="vista-deudas" class="vista">
      <h2>Deudas</h2>
      <div class="tabla-responsive">
        <table id="tabla-deudas">
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Monto Pendiente</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- BALANCE -->
    <section id="vista-balance" class="vista">
      <h2>Balance</h2>
      <select id="filtro-tipo" onchange="filtrarBalance()">
        <option value="">Todos</option>
        <option value="hoy">Hoy</option>
        <option value="mes">Este mes</option>
        <option value="anio">Este año</option>
        <option value="rango">Rango</option>
      </select>
      <input type="date" id="filtro-inicio" onchange="filtrarBalance()" />
      <input type="date" id="filtro-fin" onchange="filtrarBalance()" />
      <button onclick="descargarPDF()">Descargar PDF</button>
      <div class="tabla-responsive">
        <table id="tabla-balance">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Cantidad</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <button onclick="cambiarVista('ventas')"><span>Ventas</span></button>
    <button onclick="cambiarVista('inventario')"><span>Inventario</span></button>
    <button onclick="cambiarVista('clientes')"><span>Clientes</span></button>
    <button onclick="cambiarVista('deudas')"><span>Deudas</span></button>
    <button onclick="cambiarVista('balance')"><span>Balance</span></button>
  </footer>

  <!-- MODALES -->
  <div id="modal-venta" class="modal" onclick="cerrarModal('modal-venta')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>Nueva Venta</h3>
      <label>Producto:</label>
      <select id="venta-producto"></select>
      <label>Cantidad:</label>
      <input type="number" id="venta-cantidad" placeholder="Cantidad" />
      <label>Tipo:</label>
      <select id="venta-tipo">
        <option value="contado">Contado</option>
        <option value="credito">Crédito</option>
      </select>
      <label>Cliente:</label>
      <select id="venta-cliente"></select>
      <button onclick="registrarVenta()">Guardar</button>
      <button onclick="cerrarModal('modal-venta')">Cancelar</button>
    </div>
  </div>

  <div id="modal-inv" class="modal" onclick="cerrarModal('modal-inv')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>Nuevo Producto</h3>
      <label>Nombre:</label>
      <input type="text" id="inv-nombre" placeholder="Nombre del producto" />
      <label>Stock:</label>
      <input type="number" id="inv-stock" placeholder="Stock inicial" />
      <label>Precio:</label>
      <input type="number" id="inv-precio" placeholder="Precio unitario" />
      <button onclick="agregarProducto()">Guardar</button>
      <button onclick="cerrarModal('modal-inv')">Cancelar</button>
    </div>
  </div>

  <div id="modal-cliente" class="modal" onclick="cerrarModal('modal-cliente')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>Nuevo Cliente</h3>
      <label>Nombre:</label>
      <input type="text" id="cliente-nombre" placeholder="Nombre del cliente" />
      <button onclick="registrarCliente()">Guardar</button>
      <button onclick="cerrarModal('modal-cliente')">Cancelar</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
