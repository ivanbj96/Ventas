<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TillUp POS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>TillUp POS</h1>
    <nav>
      <button onclick="showSection('inventory')">Inventario</button>
      <button onclick="showSection('sales')">Ventas</button>
      <button onclick="showSection('balance')">Balance</button>
      <button onclick="showSection('clients')">Clientes</button>
      <button onclick="showSection('debts')">Deudas</button>
    </nav>
  </header>

  <main>
    <!-- Sección Inventario -->
    <section id="inventory" class="section">
      <h2>Inventario</h2>
      <form id="productForm">
        <input type="text" placeholder="Nombre" id="productName" required>
        <input type="number" placeholder="Costo" id="productCost" required>
        <input type="number" placeholder="Precio" id="productPrice" required>
        <input type="text" placeholder="Categoría" id="productCategory" required>
        <input type="file" accept="image/*" id="productImage">
        <button type="submit">Agregar producto</button>
      </form>
      <div id="productList"></div>
    </section>

    <!-- Sección Ventas -->
    <section id="sales" class="section hidden">
      <h2>Ventas</h2>
      <select id="clientSelector"></select>
      <div id="productSalesList"></div>
      <div id="cart"></div>
      <button onclick="finalizeSale()">Finalizar venta</button>
    </section>

    <!-- Sección Balance -->
    <section id="balance" class="section hidden">
      <h2>Balance</h2>
      <p id="totalEarnings">Ganancias: $0</p>
      <p id="totalLosses">Pérdidas: $0</p>
      <p id="pendingDebts">Deudas pendientes: $0</p>
      <button onclick="generatePDF('balance')">Generar PDF</button>
    </section>

    <!-- Sección Clientes -->
    <section id="clients" class="section hidden">
      <h2>Clientes</h2>
      <form id="clientForm">
        <input type="text" id="clientName" placeholder="Nombre del cliente" required />
        <button type="submit">Agregar Cliente</button>
      </form>
      <ul id="clientList"></ul>
    </section>

    <!-- Sección Deudas -->
    <section id="debts" class="section hidden">
      <h2>Deudas</h2>
      <div id="debtList"></div>
      <button onclick="generatePDF('debts')">Exportar deudas</button>
    </section>
  </main>

  <script src="utils.js"></script>
  <script src="pdf-generator.js"></script>
  <script src="app.js"></script>
</body>
</html>
