<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TillUp - Sin Conexión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    
    .offline-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 3rem;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 90%;
    }
    
    .offline-icon {
      font-size: 4rem;
      color: #6c757d;
      margin-bottom: 1rem;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    
    .offline-title {
      color: #343a40;
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    
    .offline-message {
      color: #6c757d;
      font-size: 1.1rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    
    .offline-features {
      background: #f8f9fa;
      border-radius: 15px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    
    .feature-item {
      display: flex;
      align-items: center;
      margin-bottom: 0.75rem;
      color: #495057;
    }
    
    .feature-item:last-child {
      margin-bottom: 0;
    }
    
    .feature-icon {
      color: #28a745;
      margin-right: 0.75rem;
      font-size: 1.2rem;
    }
    
    .btn-retry {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      padding: 0.75rem 2rem;
      border-radius: 25px;
      font-weight: 600;
      transition: all 0.3s ease;
      margin-right: 1rem;
    }
    
    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
      color: white;
    }
    
    .btn-cache {
      background: #6c757d;
      border: none;
      color: white;
      padding: 0.75rem 2rem;
      border-radius: 25px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    
    .btn-cache:hover {
      background: #5a6268;
      transform: translateY(-2px);
      color: white;
    }
    
    .connection-status {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #dc3545;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 25px;
      font-size: 0.9rem;
      font-weight: 600;
      animation: slideIn 0.5s ease;
    }
    
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    .connection-status.online {
      background: #28a745;
    }
    
    @media (max-width: 576px) {
      .offline-container {
        padding: 2rem 1.5rem;
        margin: 1rem;
      }
      
      .offline-title {
        font-size: 1.5rem;
      }
      
      .offline-message {
        font-size: 1rem;
      }
      
      .btn-retry, .btn-cache {
        display: block;
        width: 100%;
        margin-bottom: 1rem;
      }
      
      .btn-retry {
        margin-right: 0;
      }
    }
  </style>
</head>
<body>
  <div class="connection-status" id="connectionStatus">
    <i class="bi bi-wifi-off"></i> Sin conexión
  </div>
  
  <div class="offline-container">
    <div class="offline-icon">
      <i class="bi bi-wifi-off"></i>
    </div>
    
    <h1 class="offline-title">Sin conexión a internet</h1>
    
    <p class="offline-message">
      Parece que has perdido la conexión a internet. No te preocupes, TillUp puede funcionar offline.
    </p>
    
    <div class="offline-features">
      <div class="feature-item">
        <i class="bi bi-check-circle feature-icon"></i>
        <span>Puedes seguir registrando ventas</span>
      </div>
      <div class="feature-item">
        <i class="bi bi-check-circle feature-icon"></i>
        <span>Tu inventario está disponible</span>
      </div>
      <div class="feature-item">
        <i class="bi bi-check-circle feature-icon"></i>
        <span>Los datos se guardan localmente</span>
      </div>
      <div class="feature-item">
        <i class="bi bi-check-circle feature-icon"></i>
        <span>Se sincronizará cuando vuelvas a conectar</span>
      </div>
    </div>
    
    <div class="d-flex flex-column flex-sm-row justify-content-center">
      <button class="btn btn-retry" onclick="retryConnection()">
        <i class="bi bi-arrow-clockwise"></i> Reintentar
      </button>
      <button class="btn btn-cache" onclick="clearCache()">
        <i class="bi bi-trash"></i> Limpiar caché
      </button>
    </div>
  </div>

  <script>
    // Detectar cambios en la conexión
    window.addEventListener('online', () => {
      updateConnectionStatus(true);
      setTimeout(() => {
        window.location.reload();
      }, 2000);
    });
    
    window.addEventListener('offline', () => {
      updateConnectionStatus(false);
    });
    
    function updateConnectionStatus(isOnline) {
      const status = document.getElementById('connectionStatus');
      if (isOnline) {
        status.innerHTML = '<i class="bi bi-wifi"></i> Conectado';
        status.classList.add('online');
      } else {
        status.innerHTML = '<i class="bi bi-wifi-off"></i> Sin conexión';
        status.classList.remove('online');
      }
    }
    
    function retryConnection() {
      const btn = event.target;
      const originalText = btn.innerHTML;
      
      btn.innerHTML = '<i class="bi bi-arrow-clockwise spin"></i> Conectando...';
      btn.disabled = true;
      
      // Simular intento de conexión
      setTimeout(() => {
        if (navigator.onLine) {
          window.location.reload();
        } else {
          btn.innerHTML = originalText;
          btn.disabled = false;
          showMessage('Aún sin conexión. Verifica tu internet.', 'warning');
        }
      }, 3000);
    }
    
    function clearCache() {
      if ('caches' in window) {
        caches.keys().then(names => {
          return Promise.all(names.map(name => caches.delete(name)));
        }).then(() => {
          showMessage('Caché limpiado correctamente', 'success');
          setTimeout(() => {
            window.location.reload();
          }, 1500);
        }).catch(() => {
          showMessage('Error al limpiar caché', 'error');
        });
      } else {
        showMessage('Caché no disponible', 'error');
      }
    }
    
    function showMessage(message, type) {
      const alertDiv = document.createElement('div');
      alertDiv.className = `alert alert-${type === 'error' ? 'danger' : type} alert-dismissible fade show position-fixed`;
      alertDiv.style.cssText = 'top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; min-width: 300px;';
      alertDiv.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      `;
      
      document.body.appendChild(alertDiv);
      
      setTimeout(() => {
        alertDiv.remove();
      }, 5000);
    }
    
    // Verificar estado inicial
    updateConnectionStatus(navigator.onLine);
    
    // Agregar animación de spin
    const style = document.createElement('style');
    style.textContent = `
      .spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
