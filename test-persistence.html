<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Persistencia - Ventas App</title>
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
</head>
<body>
    <h1>Test de Persistencia LocalForage</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        async function testLocalForage() {
            results.innerHTML = '<h2>Iniciando tests...</h2>';
            
            try {
                // Test 1: Configuración
                localforage.config({
                    name: 'VentasApp',
                    storeName: 'ventas_data',
                    description: 'Datos de la aplicación de ventas'
                });
                results.innerHTML += '<p>✅ Configuración exitosa</p>';
                
                // Test 2: Guardar datos
                const testData = {
                    products: [{id: 1, name: 'Test Product'}],
                    clients: [{id: 1, name: 'Test Client'}],
                    sales: [{id: 1, amount: 100}],
                    debts: [],
                    chickenSales: [],
                    lastUpdate: new Date().toISOString()
                };
                
                await localforage.setItem('appData', testData);
                results.innerHTML += '<p>✅ Datos guardados exitosamente</p>';
                
                // Test 3: Cargar datos
                const loadedData = await localforage.getItem('appData');
                if (loadedData && loadedData.products.length > 0) {
                    results.innerHTML += '<p>✅ Datos cargados exitosamente</p>';
                } else {
                    results.innerHTML += '<p>❌ Error cargando datos</p>';
                }
                
                // Test 4: Verificar sincronización
                localStorage.setItem('ventasData', JSON.stringify(testData));
                localStorage.removeItem('ventasData');
                results.innerHTML += '<p>✅ Sincronización configurada</p>';
                
                results.innerHTML += '<h3>🎉 Todos los tests de persistencia PASARON</h3>';
                
            } catch (error) {
                results.innerHTML += `<p>❌ Error: ${error.message}</p>`;
            }
        }
        
        testLocalForage();
    </script>
</body>
</html>
